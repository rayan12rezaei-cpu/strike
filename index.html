<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neon Strike — 3D Shooter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812;font-family:Tahoma,Arial,sans-serif;color:#fff}
#game{position:fixed;inset:0}canvas{display:block}
#hud{position:fixed;inset:0;pointer-events:none}
.top{position:absolute;top:18px;left:18px;right:18px;display:flex;justify-content:space-between;align-items:flex-start;gap:15px}
.card{background:rgba(7,13,28,.72);border:1px solid rgba(80,210,255,.28);box-shadow:0 0 25px rgba(0,200,255,.08);backdrop-filter:blur(8px);border-radius:14px;padding:12px 16px}
.stat{min-width:145px}.label{font-size:11px;color:#91a8c8}.value{font-size:25px;font-weight:800;margin-top:3px}.accent{color:#50e6ff}
#healthWrap{width:220px;height:9px;background:#182235;border-radius:8px;overflow:hidden;margin-top:8px}.health{height:100%;width:100%;background:linear-gradient(90deg,#35f3a1,#5be8ff);transition:.15s}
#ammo{font-size:28px}.small{font-size:11px;color:#91a8c8}
#crosshair{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);opacity:.9}
#crosshair:before,#crosshair:after{content:"";position:absolute;background:#a9f6ff;box-shadow:0 0 8px #42e7ff}
#crosshair:before{width:2px;height:34px;left:16px;top:0}.crosshair:after{height:2px;width:34px;left:0;top:16px}
#crosshair i{position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;left:15px;top:15px;box-shadow:0 0 9px #fff}
#msg{position:absolute;left:50%;top:18%;transform:translateX(-50%);text-align:center;opacity:0;transition:.2s;text-shadow:0 0 15px #00d9ff}
#msg h1{margin:0;font-size:42px}.hint{font-size:13px;color:#b5c9e7;margin-top:8px}
#overlay{position:absolute;inset:0;background:radial-gradient(circle at center,rgba(10,30,58,.35),rgba(2,5,12,.94));display:flex;align-items:center;justify-content:center;text-align:center}
.panel{width:min(620px,92vw);padding:34px;border-radius:24px;background:rgba(5,10,23,.88);border:1px solid rgba(83,221,255,.35);box-shadow:0 0 70px rgba(0,180,255,.15)}
h1{font-size:48px;margin:0 0 8px;letter-spacing:2px}.subtitle{color:#91a8c8;margin-bottom:25px}
button{border:0;border-radius:13px;padding:13px 25px;background:linear-gradient(135deg,#18d5ff,#7b5cff);color:white;font-size:17px;font-weight:800;cursor:pointer;box-shadow:0 10px 30px rgba(36,178,255,.25)}
button:hover{filter:brightness(1.12);transform:translateY(-1px)}
.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:22px 0;text-align:right;color:#b9c8df;font-size:13px}.key{color:#5ceaff;font-weight:bold}
#damage{position:absolute;inset:0;background:rgba(255,30,55,.3);opacity:0;pointer-events:none}
#mobile{display:none;position:absolute;inset:0;pointer-events:none}
.joy{position:absolute;left:22px;bottom:24px;width:126px;height:126px;border:2px solid rgba(150,230,255,.35);border-radius:50%;background:rgba(8,18,35,.32);pointer-events:auto;touch-action:none}
.knob{position:absolute;width:54px;height:54px;left:34px;top:34px;border-radius:50%;background:rgba(75,220,255,.45);border:1px solid rgba(190,250,255,.7);box-shadow:0 0 18px rgba(40,210,255,.3)}
.mbtn{position:absolute;right:22px;bottom:28px;width:82px;height:82px;border-radius:50%;border:2px solid rgba(255,255,255,.45);background:rgba(255,55,100,.38);color:#fff;font-weight:900;font-size:16px;pointer-events:auto;touch-action:none}
.mbtn.reload{right:116px;bottom:40px;width:54px;height:54px;background:rgba(60,180,255,.3);font-size:11px}
@media (pointer:coarse),(max-width:800px){
 #mobile{display:block}
 #crosshair{width:28px;height:28px}
 #crosshair:before{height:28px;left:13px} #crosshair:after{width:28px;top:13px}
 .top{top:8px;left:8px;right:8px;gap:6px;justify-content:center}
 .card{min-width:0!important;padding:7px 9px;border-radius:10px}
 .stat{flex:1}.label{font-size:9px}.value{font-size:16px}
 #healthWrap{width:100%;height:6px}.small{display:none}#ammo{font-size:18px}
 .controls{grid-template-columns:1fr 1fr}
}
@media(max-width:650px){.top{flex-wrap:wrap}.card{padding:8px 11px}.stat{min-width:120px}.value{font-size:20px}h1{font-size:34px}}
</style>
</head>
<body>
<div id="game"></div>
<div id="hud">
  <div class="top">
    <div class="card stat"><div class="label">امتیاز</div><div id="score" class="value accent">0</div></div>
    <div class="card stat"><div class="label">دشمنان باقی‌مانده</div><div id="enemies" class="value">12</div></div>
    <div class="card stat"><div class="label">سلامت</div><div id="hp" class="value">100</div><div id="healthWrap"><div id="health" class="health"></div></div></div>
    <div class="card stat"><div class="label">مهمات</div><div id="ammo" class="value">30 / ∞</div><div class="small">R برای خشاب‌گذاری</div></div>
  </div>
  <div id="crosshair"><i></i></div>
  <div id="msg"><h1 id="msgTitle"></h1><div id="msgText" class="hint"></div></div>
</div>
<div id="damage"></div>
<div id="overlay">
  <div class="panel">
    <h1>NEON STRIKE</h1>
    
    <button id="start">شروع بازی</button>
  </div>
</div>
<div id="mobile">
  <div id="joy" class="joy"><div id="knob" class="knob"></div></div>
  <button id="fire" class="mbtn">FIRE</button>
  <button id="mreload" class="mbtn reload">R</button>
</div>
<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js"}}
</script>
<script type="module">
import * as THREE from 'three';

let scene,camera,renderer,clock,raycaster;
let keys={},started=false,score=0,hp=100,ammo=30,reloading=false,gameOver=false;
let enemies=[],enemyShots=[],particles=[],obstacles=[];
const arena=90, enemyTotal=12;
const $=id=>document.getElementById(id);


let joyActive=false, joyX=0, joyY=0, lookTouch=null, lastTX=0,lastTY=0;
function setupMobile(){
 const joy=document.getElementById('joy'), knob=document.getElementById('knob');
 const fire=document.getElementById('fire'), mr=document.getElementById('mreload');
 const setJoy=(e)=>{
   const r=joy.getBoundingClientRect(), cx=r.left+r.width/2, cy=r.top+r.height/2;
   let dx=e.clientX-cx,dy=e.clientY-cy, max=42, len=Math.hypot(dx,dy);
   if(len>max){dx*=max/len;dy*=max/len}
   knob.style.transform=`translate(${dx}px,${dy}px)`;
   joyX=dx/max; joyY=dy/max;
 };
 joy.addEventListener('pointerdown',e=>{joyActive=true;joy.setPointerCapture(e.pointerId);setJoy(e)});
 joy.addEventListener('pointermove',e=>{if(joyActive)setJoy(e)});
 joy.addEventListener('pointerup',()=>{joyActive=false;joyX=joyY=0;knob.style.transform='translate(0,0)'});
 fire.addEventListener('pointerdown',e=>{e.preventDefault();if(started&&!gameOver)shoot()});
 mr.addEventListener('pointerdown',e=>{e.preventDefault();if(started&&!gameOver)reload()});
 renderer.domElement.addEventListener('pointerdown',e=>{
   if(e.pointerType==='touch' && e.clientX>innerWidth*.35){lookTouch=e.pointerId;lastTX=e.clientX;lastTY=e.clientY}
 });
 renderer.domElement.addEventListener('pointermove',e=>{
   if(e.pointerType==='touch'&&e.pointerId===lookTouch&&started&&!gameOver){
     const dx=e.clientX-lastTX,dy=e.clientY-lastTY;
     camera.rotation.y-=dx*.008;camera.rotation.x-=dy*.008;
     camera.rotation.x=Math.max(-1.25,Math.min(1.25,camera.rotation.x));
     lastTX=e.clientX;lastTY=e.clientY;
   }
 });
 renderer.domElement.addEventListener('pointerup',e=>{if(e.pointerId===lookTouch)lookTouch=null});
}

init();
setupMobile();

function init(){
 scene=new THREE.Scene();
 scene.background=new THREE.Color(0x050812);
 scene.fog=new THREE.Fog(0x050812,25,125);
 camera=new THREE.PerspectiveCamera(72,innerWidth/innerHeight,.05,180);
 camera.position.set(0,2.1,18);
 renderer=new THREE.WebGLRenderer({antialias:true});
 renderer.setSize(innerWidth,innerHeight); renderer.setPixelRatio(Math.min(devicePixelRatio,2));
 renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
 $('game').appendChild(renderer.domElement);
 clock=new THREE.Clock(); raycaster=new THREE.Raycaster();

 scene.add(new THREE.HemisphereLight(0x7abaff,0x101522,1.2));
 const sun=new THREE.DirectionalLight(0xa8e7ff,2.2); sun.position.set(20,35,15); sun.castShadow=true;
 sun.shadow.mapSize.set(2048,2048); scene.add(sun);

 makeArena(); makeBuildings(); spawnEnemies();
 renderer.domElement.addEventListener('click',()=>{if(started&&!gameOver){try{if(document.pointerLockElement===null&&document.body.requestPointerLock)document.body.requestPointerLock()}catch(e){}}});
 document.addEventListener('mousemove',look);
 document.addEventListener('mousedown',e=>{if(e.button===0&&started&&!gameOver) shoot()});
 addEventListener('keydown',e=>{keys[e.code]=true;if(e.code==='KeyR') reload(); if(e.code==='Escape') document.exitPointerLock()});
 addEventListener('keyup',e=>keys[e.code]=false);
 addEventListener('resize',resize);
 $('start').onclick=()=>startGame();
 animate();
}
function mat(c,em=0){return new THREE.MeshStandardMaterial({color:c,roughness:.75,metalness:.25,emissive:em?c:0,emissiveIntensity:em?1.5:0})}
function makeArena(){
 const floor=new THREE.Mesh(new THREE.PlaneGeometry(arena,arena),new THREE.MeshStandardMaterial({color:0x0a1020,roughness:.95,metalness:.1}));
 floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; scene.add(floor);
 const grid=new THREE.GridHelper(arena,45,0x154b68,0x0d2438); grid.position.y=.015; scene.add(grid);
 for(let x=-40;x<=40;x+=10){ for(let z=-40;z<=40;z+=10){
   if(Math.abs(x)<8&&Math.abs(z)<8) continue;
   const line=new THREE.Mesh(new THREE.BoxGeometry(.07,.04,7),new THREE.MeshBasicMaterial({color:0x18b7d8}));
   line.position.set(x,.035,z); scene.add(line);
 }}
}
function makeBuildings(){
 const colors=[0x101b35,0x13213f,0x172642];
 for(let i=0;i<28;i++){
   const x=(Math.random()-.5)*78,z=(Math.random()-.5)*78;
   if(Math.hypot(x,z-15)<18) continue;
   const w=3+Math.random()*5,d=3+Math.random()*5,h=4+Math.random()*12;
   const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(colors[i%3]));
   b.position.set(x,h/2,z);b.castShadow=true;b.receiveShadow=true;scene.add(b);obstacles.push(b);
   for(let y=1.3;y<h-.5;y+=1.6){
     const win=new THREE.Mesh(new THREE.BoxGeometry(w*.45,.35,.035),new THREE.MeshBasicMaterial({color:Math.random()>.5?0x32d9ff:0xff5bd6}));
     win.position.set(x,y,z-d/2-.02);scene.add(win);
   }
 }
}
function enemyMesh(){
 const g=new THREE.Group();
 const body=new THREE.Mesh(new THREE.BoxGeometry(1.05,1.55,.65),mat(0x3d5cff));body.position.y=1.05;body.castShadow=true;g.add(body);
 const head=new THREE.Mesh(new THREE.SphereGeometry(.4,16,12),mat(0x80a9ff));head.position.y=2.1;head.castShadow=true;g.add(head);
 const eye=new THREE.Mesh(new THREE.BoxGeometry(.38,.09,.06),new THREE.MeshBasicMaterial({color:0xff315d}));eye.position.set(0,2.1,-.37);g.add(eye);
 const ring=new THREE.Mesh(new THREE.TorusGeometry(.72,.04,8,24),new THREE.MeshBasicMaterial({color:0xff315d}));ring.rotation.x=Math.PI/2;ring.position.y=.15;g.add(ring);
 return g;
}
function spawnEnemies(){
 for(let i=0;i<enemyTotal;i++){
   const e=enemyMesh(), a=Math.random()*Math.PI*2, r=15+Math.random()*27;
   e.position.set(Math.cos(a)*r,0,Math.sin(a)*r-12); e.userData={hp:2,cool:.7+Math.random()*1.7,speed:1.4+Math.random()*1.1};
   scene.add(e); enemies.push(e);
 }
}
function startGame(){started=true;gameOver=false;score=0;hp=100;ammo=30;$('overlay').style.display='none';try{if(document.pointerLockElement===null&&document.body.requestPointerLock)document.body.requestPointerLock()}catch(e){}updateHUD()}
function look(e){
 if(!started)return;
 if(document.pointerLockElement!==renderer.domElement)return;
 camera.rotation.y-=e.movementX*.0022; camera.rotation.x-=e.movementY*.0022;
 camera.rotation.x=Math.max(-1.35,Math.min(1.35,camera.rotation.x));
}
function shoot(){
 if(reloading||ammo<=0){if(ammo<=0)reload();return}
 ammo--; updateHUD();
 // muzzle flash
 const flash=new THREE.PointLight(0x9befff,7,5); flash.position.copy(camera.position); scene.add(flash); setTimeout(()=>scene.remove(flash),45);
 raycaster.setFromCamera(new THREE.Vector2(0,0),camera);
 const targets=[];
 enemies.forEach(e=>e.children.forEach(c=>targets.push(c)));
 const hits=raycaster.intersectObjects(targets,false);
 if(hits.length){
   let e=hits[0].object; while(e.parent&&!enemies.includes(e)) e=e.parent;
   if(enemies.includes(e)){
     e.userData.hp--; burst(hits[0].point,0x58e8ff,7);
     if(e.userData.hp<=0) killEnemy(e);
   }
 } else {
   const p=raycaster.ray.origin.clone().add(raycaster.ray.direction.clone().multiplyScalar(55));
   burst(p,0x37dfff,3);
 }
}
function reload(){
 if(reloading||ammo===30)return; reloading=true; $('ammo').textContent='RELOADING…';
 setTimeout(()=>{ammo=30;reloading=false;updateHUD()},850);
}
function killEnemy(e){
 burst(e.position.clone().add(new THREE.Vector3(0,1.2,0)),0xff4d8d,18);
 scene.remove(e); enemies=enemies.filter(x=>x!==e); score+=100; updateHUD();
 if(enemies.length===0) endGame(true);
}
function enemyFire(e){
 const start=e.position.clone().add(new THREE.Vector3(0,1.3,0));
 const dir=camera.position.clone().sub(start).normalize();
 const m=new THREE.Mesh(new THREE.SphereGeometry(.09,8,8),new THREE.MeshBasicMaterial({color:0xff3e72}));
 m.position.copy(start);m.userData.vel=dir.multiplyScalar(18);m.userData.life=4;scene.add(m);enemyShots.push(m);
}
function burst(pos,color,n){
 for(let i=0;i<n;i++){
   const p=new THREE.Mesh(new THREE.SphereGeometry(.045+Math.random()*.045,6,6),new THREE.MeshBasicMaterial({color}));
   p.position.copy(pos);p.userData.vel=new THREE.Vector3((Math.random()-.5)*5,Math.random()*5,(Math.random()-.5)*5);p.userData.life=.35+Math.random()*.4;
   scene.add(p);particles.push(p);
 }
}
function update(dt){
 const speed=(keys.ShiftLeft||keys.ShiftRight)?10:5.5;
 const dir=new THREE.Vector3();
 if(keys.KeyW)dir.z-=1;if(keys.KeyS)dir.z+=1;if(keys.KeyA)dir.x-=1;if(keys.KeyD)dir.x+=1;dir.x+=joyX;dir.z+=joyY;
 if(dir.lengthSq()){dir.normalize().multiplyScalar(speed*dt);const yaw=camera.rotation.y;
   const x=dir.x*Math.cos(yaw)-dir.z*Math.sin(yaw),z=dir.x*Math.sin(yaw)+dir.z*Math.cos(yaw);
   camera.position.x+=x;camera.position.z+=z;
 }
 camera.position.x=THREE.MathUtils.clamp(camera.position.x,-43,43);camera.position.z=THREE.MathUtils.clamp(camera.position.z,-43,43);camera.position.y=2.1;

 enemies.forEach(e=>{
   const to=camera.position.clone().sub(e.position);to.y=0;const d=to.length();
   e.lookAt(camera.position.x,e.position.y+1,camera.position.z);
   if(d>7){e.position.add(to.normalize().multiplyScalar(e.userData.speed*dt))}
   e.userData.cool-=dt;if(d<30&&e.userData.cool<=0){enemyFire(e);e.userData.cool=1.2+Math.random()*1.8}
 });
 enemyShots.forEach(m=>{
   m.position.addScaledVector(m.userData.vel,dt);m.userData.life-=dt;
   if(m.userData.life<=0){scene.remove(m);enemyShots=enemyShots.filter(x=>x!==m);return}
   if(m.position.distanceTo(camera.position)<.65){damage(8);scene.remove(m);enemyShots=enemyShots.filter(x=>x!==m)}
 });
 particles.forEach(p=>{p.position.addScaledVector(p.userData.vel,dt);p.userData.vel.y-=9*dt;p.userData.life-=dt;if(p.userData.life<=0){scene.remove(p);particles=particles.filter(x=>x!==p)}});
}
function damage(n){hp=Math.max(0,hp-n);$('damage').style.opacity=.55;setTimeout(()=>$('damage').style.opacity=0,90);updateHUD();if(hp<=0)endGame(false)}
function endGame(win){
 gameOver=true;document.exitPointerLock();$('overlay').style.display='flex';
 $('overlay').querySelector('h1').textContent=win?'MISSION COMPLETE':'MISSION FAILED';
 const sub=$('overlay').querySelector('.subtitle');
 if(sub) sub.textContent=`امتیاز نهایی: ${score}`;
 $('overlay').querySelector('button').textContent='دوباره بازی کن';
}
function updateHUD(){$('score').textContent=score;$('enemies').textContent=enemies.length;$('hp').textContent=hp;$('health').style.width=hp+'%';if(!reloading)$('ammo').textContent=ammo+' / ∞'}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.033);if(started&&!gameOver)update(dt);renderer.render(scene,camera)}
</script>
</body>
</html>
